<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="vip.css" />
    <title>Kalkulator Free</title>
  </head>
  <body>
    <main>
      <section class="section1">
        <div class="main_div">
          <div class="div1">
            <h1>Free</h1>
          </div>

          <form class="form1">
            <input type="text" placeholder="Free Calculator" id="input1" />
          </form>

          <div class="div2">
            <button onclick="clearall()">AC</button>
            <button onclick="hitung('%')">%</button>
            <button onclick="hapus()">DEL</button>
            <button onclick="hitung('/')">/</button>
            <button onclick="hitung(7)">7</button>
            <button onclick="hitung(8)">8</button>
            <button onclick="hitung(9)">9</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung(4)">4</button>
            <button onclick="hitung(5)">5</button>
            <button onclick="hitung(6)">6</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung(1)">1</button>
            <button onclick="hitung(2)">2</button>
            <button onclick="hitung(3)">3</button>
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('00')">00</button>
            <button onclick="hitung(0)">0</button>
            <button onclick="hitung('.')">.</button>
            <button onclick="hasil()" id="hsl">=</button>
          </div>
        </div>
      </section>
    </main>

    <script src="vip.js"></script>
  </body>
</html>
