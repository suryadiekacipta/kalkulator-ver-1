<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/2.png" />
    <link rel="stylesheet" href="vip.css" />
    <title>VIP Member</title>
  </head>
  <body>
    <main>
      <section class="section1">
        <div class="div_dasboard">
          <div class="div_dasboard1">
            <img src="assets/mahkota.svg" alt="icon" />
            <div>
              <h1>VIP Member</h1>
              <h5 id="waktu_aktif" class="waktu_aktif"></h5>
            </div>
          </div>
          <hr class="hr1" />
          <button class="button1">
            <img src="assets/home1.svg" />
            Dashboard
          </button>

          <hr class="hr2" />

          <div class="div_dasboard2">
            <h2>STATUS VIP</h2>
            <div class="div_dasboard3">
              <img src="assets/infinitygold.svg" />

              <div class="div_dasboard4">
                <h3>Unlimited Token</h3>
                <h4>Tidak ada batasan</h4>
              </div>
            </div>
          </div>

          <hr class="hr2" />

          <div class="div_dasboard5">
            <h2>FITUR VIP</h2>
            <div class="bungkus_list">
              <div class="list_fitur1">
                <img src="assets/infinitygold.svg" />
                <h4>Unlimited Token</h4>
              </div>

              <div class="list_fitur1">
                <img src="assets/noads.png" />
                <h4>No Ads</h4>
              </div>

              <div class="list_fitur1">
                <img src="assets/thunder.png" />
                <h4>Priority Calculator</h4>
              </div>

              <div class="list_fitur1">
                <img src="assets/history.png" />
                <h4>History Perhitungan</h4>
              </div>

              <div class="list_fitur1">
                <img src="assets/plate1.png" />
                <h4>Tema Eksklusif</h4>
              </div>
            </div>
          </div>
          <hr class="hr2" />

          <button class="button2">
            <img src="assets/seting.png" />Settings
          </button>
        </div>

        <div class="cal1">
          <div class="cal2">
            <img src="assets/crown.png" />
            <h1>VIP Calculator</h1>
          </div>
          <h2 class="unacc">Unlimited Access</h2>

          <div class="cal3">
            <img src="assets/VIP.png" />
            <div class="cal4">
              <h2>VIP MEMBER</h2>
              <h3>Unlimited Token</h3>
              <h4>Status:</h4>
            </div>
          </div>
        </div>

        <!-- pemisah history perhitungan -->

        <div class="his1"></div>
      </section>
    </main>

    <script src="vip.js"></script>
  </body>
</html>
